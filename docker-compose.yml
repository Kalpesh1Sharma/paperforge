services:
  backend:
    build:
      context: ./backend
    env_file:
      - ${PAPERFORGE_ENV_FILE:-./backend/.env}
    environment:
      REPORT_STORAGE_DIR: /data/reports
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - paperforge-data:/data/reports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  paperforge-data:
